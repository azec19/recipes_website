services:
  database:
    container_name: database
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: V4aWHzuhmX16mI8dMyn7
      POSTGRES_USER: azec
      POSTGRES_DB: recipes
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '5432:5432'


  backend:
    container_name: backend
    restart: always
    build: ./backend
    ports:
      - '3000:3000'
    depends_on: 
      database:
        condition: service_started
    volumes:
      - upload-backend:/app/upload
    environment:
      - WATCHPACK_POLLING=true
    env_file:
      - .env_backend

  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend/recipes
      args:
        BACKEND_URL: ${BACKEND_URL}
    ports:
      - '3005:3000'
    depends_on: 
      - backend

volumes:
  postgres-data:
  upload-backend:

